name: Android APK build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "apps/mobile/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: socialize-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Socialize Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Link or initialize the Expo project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            exit 1
          fi
          npx --yes eas-cli@latest project:init --force --non-interactive

      - name: Check Expo SDK dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Generate Android project and verify Kotlin version
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean
          echo "Checking generated Android Kotlin configuration..."
          echo "Generated Gradle Kotlin settings:"
          grep -R -n '1.9.25\|1.9.24' android/build.gradle android/gradle.properties android/settings.gradle || true
          if ! grep -R -q '1.9.25' android; then
            echo "Kotlin 1.9.25 was not found in generated Android files."
            exit 1
          fi

      - name: Build Android preview APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
