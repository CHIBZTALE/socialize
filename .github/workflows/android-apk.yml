name: Android APK build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialize-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Socialize Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Link or initialize the Expo project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            exit 1
          fi
          npx --yes eas-cli@latest project:init --non-interactive

      - name: Build Android preview APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
