name: Socialize CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: socialize-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: socialize
          POSTGRES_PASSWORD: socialize_ci
          POSTGRES_DB: socialize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialize -d socialize"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://socialize:socialize_ci@localhost:5432/socialize?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @socialize/api prisma:generate

      - name: Apply versioned database migrations
        run: pnpm --filter @socialize/api exec prisma migrate deploy

      - name: Build API
        run: pnpm --filter @socialize/api build

      - name: Build API container image
        run: docker build --tag socialize-api:ci .

      - name: Build web
        run: pnpm --filter @socialize/web build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000

  mobile-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: pnpm exec expo config --type public

      - name: Validate EAS build profiles
        run: node -e "JSON.parse(require('fs').readFileSync('apps/mobile/eas.json', 'utf8'))"

      - name: Type-check mobile application
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit
