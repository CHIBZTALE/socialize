name: Diagnose failed Socialize EAS build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-build-diagnostics.yml"
      - "apps/mobile/app.json"

permissions:
  contents: read

jobs:
  inspect-eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Retrieve and decode full Gradle failure log
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: 32183ff4-048f-419a-b168-32620df08183
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json > /tmp/eas-build.json
          node -e "const d=require('/tmp/eas-build.json'); console.log('BUILD STATUS:', d.status); console.log('ERROR:', JSON.stringify(d.error)); console.log('LOG FILES:', d.logFiles?.length || 0); if (!d.logFiles?.length) process.exit(2); require('fs').writeFileSync('/tmp/eas-log-url', d.logFiles[0])"
          curl -fL "$(cat /tmp/eas-log-url)" -o /tmp/eas-build-log.bin
          echo "===== LOG FILE FORMAT ====="
          file /tmp/eas-build-log.bin
          echo "===== DECODE LOG ====="
          if zstd -t /tmp/eas-build-log.bin >/dev/null 2>&1; then
            zstd -dc /tmp/eas-build-log.bin > /tmp/eas-build-log.txt
          elif gzip -t /tmp/eas-build-log.bin >/dev/null 2>&1; then
            gzip -dc /tmp/eas-build-log.bin > /tmp/eas-build-log.txt
          elif unzip -t /tmp/eas-build-log.bin >/dev/null 2>&1; then
            unzip -p /tmp/eas-build-log.bin > /tmp/eas-build-log.txt
          else
            cp /tmp/eas-build-log.bin /tmp/eas-build-log.txt
          fi
          echo "===== GRADLE FAILURE CONTEXT ====="
          grep -niE -C 8 'error|failed|failure|exception|could not|cannot find|not found|what went wrong|ExpoModulesPackage' /tmp/eas-build-log.txt | tail -n 300 || true
          echo "===== FINAL 250 LOG LINES ====="
          tail -n 250 /tmp/eas-build-log.txt
