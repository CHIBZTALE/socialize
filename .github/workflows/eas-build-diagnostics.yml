name: Diagnose failed Socialize EAS build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-build-diagnostics.yml"
      - "apps/mobile/app.json"

permissions:
  contents: read

jobs:
  inspect-eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify linked Expo project and retrieve failed build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: 087a9b31-ef21-48c6-8adc-9e4db5d2e5d0
        run: |
          echo "===== LINKED EXPO PROJECT ====="
          npx --yes eas-cli@latest project:info --non-interactive
          echo "===== FAILED BUILD DETAILS ====="
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json --non-interactive | tee /tmp/eas-build.json
          echo "===== BUILD LOG REFERENCES ====="
          node -e "const d=require('/tmp/eas-build.json'); console.log(JSON.stringify(d, null, 2))"
